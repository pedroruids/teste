# CI: formatação, análise estática e testes (Laravel) + lint e build (Next.js).
#
# Pressupõe: Pest 5 (PHP 8.4+), Pint, Larastan (phpstan.neon na raiz),
# Next.js em frontend/.
#
# Base de dados: MySQL 8.4 em service container — os mesmos valores que o
# phpunit.xml (root sem password, base teste_test), para local e CI correrem
# no mesmo motor.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  laravel:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: teste_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mysqli, gd
          coverage: none

      - name: Localizar a cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (formatação)
        run: ./vendor/bin/pint --test

      - name: Larastan (análise estática)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: teste_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: ./vendor/bin/pest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
